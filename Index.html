<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة طلب كارنيه الكلية</title>
    <style>
        /* إزالة الحواف والفراغات لجعل الصفحة تغطي الشاشة بالكامل */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* منع أشرطة التمرير المزدوجة */
            background-color: #f5f7f6; /* نفس لون خلفية التصميم الخاص بك */
        }
        
        /* إعداد الإطار (iframe) ليأخذ مساحة الشاشة بالكامل */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- تضمين رابط تطبيق جوجل سكربت الخاص بك هنا -->
    <iframe src="https://script.google.com/macros/s/AKfycbxQtmgtqPQk9Dd3EaeiWXLQNmYkt9RrfqBTDetEfnjNes17q0DFcMueAC7hA5LCz2kuog/exec" allow="camera; microphone; fullscreen"></iframe>

</body>
</html>
